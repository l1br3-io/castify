[package]
name = "castify-api"
description = "Castify HTTP API and bundled SPA server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "castify"
path = "src/main.rs"

[features]
e2e = []

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
bytes = "1.10"
castify-auth.workspace = true
castify-cache.workspace = true
castify-catalog.workspace = true
castify-core.workspace = true
castify-storage.workspace = true
cookie = "0.18.1"
dotenvy = "0.15"
futures = "0.3"
mime_guess = "2.0.5"
rand = { version = "0.8", features = ["std_rng"] }
rust-embed = { version = "8.11.0", features = ["compression"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
