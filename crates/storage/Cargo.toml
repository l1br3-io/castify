[package]
name = "castify-storage"
description = "Castify persistence layer (SQLite via sqlx, migrations, repositories)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "macros", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
