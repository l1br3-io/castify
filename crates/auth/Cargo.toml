[package]
name = "castify-auth"
description = "Castify owner authentication: password, sessions, middleware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
base64 = "0.22.1"
castify-core.workspace = true
castify-storage.workspace = true
chrono = "0.4.45"
hmac = "0.12.1"
rand = { version = "0.8", features = ["std_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = "1.20.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
