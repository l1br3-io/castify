# Compose override for e2e tests.
#
# Builds the binary with the `e2e` cargo feature, which enables test-only
# mock provider factories and a seed endpoint (`POST /api/__e2e/seed-connection`).
# These endpoints are NOT present in production builds.
#
# The runtime target is the alpine+ffmpeg stage (`e2e-runtime` in the
# Dockerfile) so the Playwright suite can exercise the real transcode
# pipeline (strategy override → ffmpeg → HLS → hls.js) — see
# docs/specs/sharing task 013.
#
# Also boots MinIO (docs/specs/s3-compatible-storage task 009) seeded from
# `e2e/fixtures/bucket/`. MinIO shares the castify service's network
# namespace: the API reaches it at the loopback endpoint
# `http://localhost:9000` (exercising the production SSRF allowance for
# loopback http), and the shared-namespace port publish below puts the same
# host string within reach of the Playwright browser — one endpoint value
# works for server, SDK, and presigned-URL consumers alike.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

services:
  castify:
    build:
      context: .
      target: e2e-runtime
      args:
        E2E: "true"
    # MinIO binds :9000 inside this service's network namespace; publishing
    # it here (the netns owner) exposes MinIO to the host/browser.
    ports:
      - "9000:9000"

  # Images are digest-pinned so the suite stays reproducible: an upstream
  # release must not break CI on a schedule nobody controls. Bump
  # deliberately, re-running `just e2e` against the new pair.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    network_mode: "service:castify"
    depends_on:
      - castify
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: castify-e2e
      MINIO_ROOT_PASSWORD: castify-e2e-secret
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot seeder: waits for MinIO, creates the `media` bucket, uploads
  # the fixture set, then flips anonymous download on as the completion
  # marker the Playwright spec polls for (object GET → 206/200).
  minio-seed:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    network_mode: "service:castify"
    depends_on:
      - minio
    volumes:
      - ./e2e/fixtures/bucket:/fixtures:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set seed http://127.0.0.1:9000 castify-e2e castify-e2e-secret; do
          echo "waiting for minio…"; sleep 1;
        done
        mc mb --ignore-existing seed/media
        mc cp --recursive /fixtures/ seed/media/
        mc anonymous set download seed/media
        echo "seeded objects:"; mc ls --recursive seed/media

volumes:
  minio-data:
